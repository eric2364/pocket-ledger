name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test sites/pocket-ledger/tests/api.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl
      - run: npm run test:migration
      - name: Verify iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist
      - name: Verify web application bundle
        run: npm run export:web
